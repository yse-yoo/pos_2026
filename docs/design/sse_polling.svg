<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f1f5f9"/>

  <g transform="translate(50, 50)">
    <rect width="260" height="220" rx="15" fill="url(#terminalGrad)" stroke="#94a3b8" stroke-width="2"/>
    <rect width="220" height="130" x="20" y="20" rx="5" fill="#1e293b"/>
    <text x="130" y="85" fill="#38bdf8" font-family="monospace" font-size="14" text-anchor="middle">Processing Order...</text>
    <text x="130" y="190" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">レジ担当端末</text>
    <text x="130" y="210" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="middle">(PC / 管理画面)</text>

    <g transform="translate(0, 380)">
      <rect width="260" height="220" rx="15" fill="url(#terminalGrad)" stroke="#94a3b8" stroke-width="2"/>
      <rect width="140" height="150" x="60" y="15" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
      <rect width="120" height="20" x="70" y="110" rx="4" fill="#0284c7"/>
      <text x="130" y="125" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PAY NOW</text>
      <text x="130" y="190" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">購入ユーザ端末</text>
      <text x="130" y="210" fill="#64748b" font-family="sans-serif" font-size="12" text-anchor="middle">(スマートフォン)</text>
    </g>
  </g>

  <g transform="translate(620, 50)">
    <rect width="330" height="600" rx="20" fill="url(#serverGrad)" stroke="#475569" stroke-width="3"/>
    <text x="165" y="40" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Web Server (PHP)</text>

    <rect width="200" height="100" x="65" y="80" rx="10" fill="#8892be" fill-opacity="0.2" stroke="#8892be" stroke-width="2"/>
    <text x="165" y="125" fill="#4f5b93" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">PHP-FPM</text>
    <text x="165" y="150" fill="#4f5b93" font-family="sans-serif" font-size="12" text-anchor="middle">(Engine)</text>

    <rect width="200" height="100" x="65" y="240" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="165" y="285" fill="#166534" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">APCu Cache</text>
    <text x="165" y="310" fill="#166534" font-family="sans-serif" font-size="12" text-anchor="middle">決済フラグ / 注文状態</text>

    <path d="M 65,460 C 65,440 265,440 265,460 L 265,540 C 265,560 65,560 65,540 Z" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <ellipse cx="165" cy="460" rx="100" ry="20" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
    <text x="165" y="515" fill="#334155" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Database</text>
  </g>

  <path d="M 310,120 L 610,120" stroke="#475569" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <rect x="360" y="90" width="200" height="25" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="460" y="108" fill="#334155" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">① HTTP POST (注文登録)</text>

  <path d="M 610,160 C 500,160 500,450 310,450" stroke="#0284c7" stroke-width="3" fill="none" marker-end="url(#arrow-blue)" stroke-dasharray="8 4"/>
  <rect x="360" y="270" width="220" height="25" rx="5" fill="#ffffff" stroke="#0284c7"/>
  <text x="470" y="288" fill="#0369a1" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">② SSE (注文受付を通知)</text>

  <path d="M 310,550 L 610,550" stroke="#475569" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <rect x="360" y="560" width="200" height="25" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="460" y="578" fill="#334155" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">③ HTTP POST (決済実行)</text>

  <path d="M 310,210 L 610,210" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)" marker-start="url(#arrow-orange)"/>
  <rect x="340" y="220" width="240" height="25" rx="5" fill="#ffffff" stroke="#ea580c"/>
  <text x="460" y="238" fill="#c2410c" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">④ HTTP Polling (決済完了を確認)</text>

  <g transform="translate(50, 660)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#475569" stroke-width="2"/>
    <text x="40" y="15" font-family="sans-serif" font-size="12">Standard HTTP</text>
    <line x1="160" y1="10" x2="190" y2="10" stroke="#0284c7" stroke-width="3" stroke-dasharray="4 2"/>
    <text x="200" y="15" font-family="sans-serif" font-size="12">SSE (Push)</text>
    <line x1="310" y1="10" x2="340" y2="10" stroke="#ea580c" stroke-width="2"/>
    <text x="350" y="15" font-family="sans-serif" font-size="12">Polling</text>
  </g>
</svg>
